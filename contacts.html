<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Контакты — Pumpkin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <header class="site-header" >
    <div class="container">
      <a class="logo" href="index.html">Pumpkin</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <ol>
            <li><a href="index.html">Главная</a></li>
            <li>Контакты</li>
          </ol>
        </nav>

        <h1>Контакты</h1>

        <div class="contact-box">
          <p><strong>Адрес:</strong> г. Москва, проспект Вернадского, д. 78</p>
          <p><strong>Телефон:</strong> <a href="tel:+78000000000">+7 800 000-00-00</a></p>
          <p><strong>E-mail:</strong> <a href="mailto:info@example.ru">info@Pumpkin.ru</a></p>
        </div>

        <h2>Форма обратной связи</h2>
        <form class="order-form" id="contact-form" action="#" method="post">
          <label for="contact-name">Имя</label>
          <input id="contact-name" name="name" type="text" minlength="2" maxlength="50" autocomplete="name" required>

          <label for="contact-email">E-mail</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" required>

          <label for="contact-message">Сообщение</label>
          <textarea id="contact-message" name="message" rows="4" maxlength="500" required></textarea>

          <p class="form-message" id="contact-message-status" hidden>Сообщение отправлено.</p>

          <div class="form-actions">
            <button class="button" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>Учебный проект Pumpkin</p></div>
  </footer>

  <a class="up-button" href="#top" aria-label="Наверх">↑</a>
  <script src="js/main.js"></script>
</body>
</html>
