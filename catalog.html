<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Каталог настольных ламп Lumen.">
  <title>Каталог — Lumen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Lumen</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="contacts.html">Контакты</a></li>
          <li><a href="index.html#popular">Популярное</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a> / <span>Каталог</span>
      </nav>
      <h1>Каталог</h1>

      <aside class="catalog-note">
        <h2>Категория</h2>
        <p>Настольные лампы</p>
      </aside>

      <section>
        <h2>Модели</h2>

          <img class="product-card__image" src="images/lamp.svg" alt="Настольная лампа Lumen One">
          <div class="product-card__content">
            <h3 class="product-card__title">Lumen One</h3>
            <p>Компактная модель для рабочего стола.</p>
            <p class="product-card__price">3 490 ₽</p>
            <a class="button" href="contacts.html">Уточнить наличие</a>

        </article>
      </section>
    </div>

  <footer class="site-footer">
    <div class="container"><p>Учебный проект Lumen</p></div>
  </footer>
