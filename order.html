<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Форма заявки на товар Pumpkin.">
  <title>Заявка — Pumpkin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="top">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Pumpkin</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
          <ol>
            <li><a href="index.html">Главная</a></li>
            <li>Заявка</li>
          </ol>
        </nav>

        <h1>Оформление заявки</h1>

        <form class="order-form" id="order-form" action="#" method="post">
          <label for="order-name">Имя</label>
          <input id="order-name" name="name" type="text" minlength="2" maxlength="50" autocomplete="name" required>

          <label for="order-email">E-mail</label>
          <input id="order-email" name="email" type="email" placeholder="name@example.ru" autocomplete="email" required>

          <label for="order-phone">Телефон</label>
          <input id="order-phone" name="phone" type="tel" inputmode="tel" placeholder="+79000000000" pattern="\+7[0-9]{10}" autocomplete="tel" required>

          <label for="order-item">Товар</label>
          <select id="order-item" name="item" required>
            <option value="">Выберите товар</option>
            <option value="Listopad">Гирлянда "Листопад"</option>
            <option value="Osen">Искуственный букет "Осень"</option>
            <option value="Tykva">Подсвечник "Тыква"</option>
            <option value="Zhyoludi">Гирлянда "Жёлуди"</option>
            <option value="Lesnoj_urozhaj">Подвесной декор "Лесной урожай"</option>
            <option value="Klenovyj_list">Свеча в подсвечнике "Кленовый лист"</option>
          </select>

          <label for="order-date">Желаемая дата связи</label>
          <input id="order-date" name="contact-date" type="date">

          <label for="order-comment">Комментарий</label>
          <textarea id="order-comment" name="comment" rows="4" maxlength="300"></textarea>

          <label class="checkbox-label" for="order-agreement">
            <input id="order-agreement" name="agreement" type="checkbox" required>
            Согласен на обработку данных
          </label>

          <p class="form-message" id="form-message" hidden>Заявка отправлена. Мы свяжемся с вами.</p>

          <div class="form-actions">
            <button class="button" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container"><p>Учебный проект Pumpkin · <a href="contacts.html">Контакты</a></p></div>
  </footer>

  <a class="up-button" href="#top" aria-label="Наверх">↑</a>
  <script src="js/main.js"></script>
</body>
</html>
